name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # lets the keepalive step re-enable the schedule via the API (no commits)

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/scripts/requirements-keepalive.txt

      - name: Install Playwright (workflow only, not an app dependency)
        run: |
          pip install -r .github/scripts/requirements-keepalive.txt
          playwright install --with-deps chromium

      - name: Visit the app(s)
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: python .github/scripts/wake_app.py

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore

      # Prevents GitHub from disabling the schedule after 60 days of repo inactivity.
      - uses: liskin/gh-workflow-keepalive@v1
